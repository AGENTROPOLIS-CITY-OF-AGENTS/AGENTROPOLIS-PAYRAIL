[package]
name = "greenrails-settlement"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MOCK GREENRAILS settlement state machine: fiat/crypto -> exact-output $XENTS -> NFT transfer -> USDC (Base) seller payout. No network, no funds move."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1.4"

[lints.rust]
unsafe_code = "forbid"
