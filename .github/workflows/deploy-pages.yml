name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read, pages: write, and id-token: write are the only token
# permissions this workflow uses. pages: write and id-token: write are what
# actions/upload-pages-artifact and actions/deploy-pages require.
# This workflow does not read or set any secrets. The mock demo build is
# tsc plus scripts/copy-static.mjs and does not call a payment endpoint.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-greenrails-mock-demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # tsc still emits runtime modules to dist/src and tests to dist/test.
      # The package test script keeps running node --test dist/test/.
      - name: Build greenrails mock demo
        run: pnpm --filter @agentropolis/greenrails-mock-demo build

      # Allowlist only. public/ is the HTML entry and static assets.
      # dist/src is the runtime modules the page imports. dist/test is not copied.
      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          app=apps/greenrails-mock-demo
          out="$app/pages"
          rm -rf "$out"
          mkdir -p "$out/src"
          cp -a "$app/public/." "$out/"
          cp -a "$app/dist/src/." "$out/src/"

      - name: Reject test paths in the Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          out=apps/greenrails-mock-demo/pages
          hits="$(find "$out" \( -name '*.test.*' -o -path '*/test' -o -path '*/test/*' \) | sort)"
          if [ -n "$hits" ]; then
            printf 'Pages artifact contains test paths:\n%s\n' "$hits"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/greenrails-mock-demo/pages

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
