name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read, pages: write, and id-token: write are the only token
# permissions this workflow uses. pages: write and id-token: write are what
# actions/upload-pages-artifact and actions/deploy-pages require.
# This workflow does not read or set any secrets. The mock demo build is
# tsc plus scripts/copy-static.mjs and does not call a payment endpoint.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-greenrails-mock-demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # Output directory, confirmed by a local build: apps/greenrails-mock-demo/dist
      # (index.html from public/, compiled modules under dist/src/).
      - name: Build greenrails mock demo
        run: pnpm --filter @agentropolis/greenrails-mock-demo build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/greenrails-mock-demo/dist

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
