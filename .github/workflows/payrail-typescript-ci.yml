name: PAYRAIL TypeScript CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "recipes/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/payrail-typescript-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "recipes/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/payrail-typescript-ci.yml"

permissions:
  contents: read

jobs:
  typescript-critical:
    name: typescript-critical
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck critical TypeScript packages
        run: |
          pnpm --filter @agentropolis/payrail-core typecheck
          pnpm --filter @agentropolis/x402-adapter typecheck
          pnpm --filter @agentropolis/receipt-engine typecheck
          pnpm --filter @agentropolis/wallet-guard typecheck
          pnpm --filter @agentropolis/monero-adapter typecheck
          pnpm --filter @agentropolis/pricing-rules typecheck
          pnpm --filter @agentropolis/gateway-api typecheck

      - name: Run financial hardening tests
        run: |
          pnpm --filter @agentropolis/payrail-core test
          pnpm --filter @agentropolis/x402-adapter test
          pnpm --filter @agentropolis/receipt-engine test
          pnpm --filter @agentropolis/wallet-guard test
          pnpm --filter @agentropolis/monero-adapter test

      - name: Build critical libraries
        run: |
          pnpm --filter @agentropolis/payrail-core build
          pnpm --filter @agentropolis/x402-adapter build
          pnpm --filter @agentropolis/receipt-engine build
          pnpm --filter @agentropolis/wallet-guard build
          pnpm --filter @agentropolis/monero-adapter build
          pnpm --filter @agentropolis/pricing-rules build
